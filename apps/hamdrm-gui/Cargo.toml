[package]
name = "hamdrm-gui"
description = "DecHAMDRM desktop GUI (egui): HamDRM pictures, files and waterfall ID"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "dechamdrm-gui"
path = "src/main.rs"

[dependencies]
hamdrm-core.workspace = true
hamdrm-engine.workspace = true
# The glow (OpenGL) renderer, as DecSAT and DecAero.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.17.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# JPEG 2000 (pure-Rust OpenJPEG port): view received .jp2 and transcode pictures to send.
jpeg2k = "0.11"
